# Pubblicazione delle immagini su Docker Hub, a ogni tag v*.
#
# Richiede due secret nel repository:
#   DOCKERHUB_USERNAME   l'utente Docker Hub
#   DOCKERHUB_TOKEN      un access token, non la password
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da assegnare alle immagini"
        required: true
        default: "latest"

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/visioncaption-server

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # La variante NVIDIA è quella predefinita: è il bersaglio del deploy.
          - torch: cu128
            suffix: ""
          - torch: cpu
            suffix: "-cpu"
    steps:
      - uses: actions/checkout@v4

      - name: Fa spazio sul runner
        # Le ruote CUDA di torch pesano qualche gigabyte e il runner parte con
        # poco spazio libero.
        if: matrix.torch == 'cu128'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: TORCH_VARIANT=${{ matrix.torch }}
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.value }}${{ matrix.suffix }}
            ${{ env.IMAGE }}:latest${{ matrix.suffix }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
