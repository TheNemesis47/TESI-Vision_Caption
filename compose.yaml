# VisionCaption, server e client.
#
#   docker compose up -d                        tutto in cloud (OpenRouter + ElevenLabs)
#   docker compose --profile local-vlm up -d    modello visivo in casa, con Ollama
#   docker compose --profile local-tts up -d    voce in casa, con Chatterbox
#   docker compose --profile local-tts-fish up -d    voce in casa, con Fish Speech
#   docker compose --profile local-vlm --profile local-tts up -d     niente cloud
#
# Di suo nessun servizio chiede la GPU, così questo file parte anche su una
# macchina che non ne ha. Per usarla si aggiunge compose.gpu.yaml, una volta
# sola, mettendo nel .env:  COMPOSE_FILE=compose.yaml:compose.gpu.yaml
# e, perché valga anche su Windows, COMPOSE_PATH_SEPARATOR=:
#
# Le chiavi e le soglie stanno nel .env accanto a questo file: si parte da
# .env.example. I profili accendono i servizi locali, il .env dice al server
# quale usare.
name: visioncaption

services:
  server:
    image: ${IMAGE_NAMESPACE:-thenemesis47}/visioncaption-server:${IMAGE_TAG:-latest}
    build:
      context: .
      args:
        # cu128 per NVIDIA, rocm7.2 per AMD, cpu per nessuna GPU.
        TORCH_VARIANT: ${TORCH_VARIANT:-cu128}
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    env_file:
      - path: .env
        required: false
    environment:
      SERVER_HOST: 0.0.0.0
      # Il modello della mano incluso nell'immagine. Sta qui e non nel .env
      # perché il .env copiato da .env.example punta a models/, che nel
      # contenitore è la cartella montata dall'host e di solito non lo ha.
      HAND_LANDMARKER_MODEL_PATH: /app/bundled/hand_tracking/hand_landmarker.task
      # Gli indirizzi dei servizi locali stanno nel .env, non qui: imporli da
      # questo file li imporrebbe anche a chi ha scelto il cloud, e le
      # descrizioni finirebbero contro un Ollama che non è stato acceso.
      # .env.example ha le due righe pronte, commentate.
    volumes:
      # Il checkpoint RF-DETR adattato: sta fuori dall'immagine perché pesa e
      # perché è materiale di chi lo ha addestrato.
      - ./models:/app/models:ro
      # I log, compresi quelli di ricerca in logs/research, sopravvivono a un
      # aggiornamento del contenitore. Un volume con nome, non una cartella
      # dell'host: eredita i permessi dell'utente del contenitore, che su una
      # cartella creata da Docker non potrebbe scrivere. Per copiarli fuori:
      #   docker compose cp server:/app/logs/research ./research
      - server-logs:/app/logs
    ports:
      - "${SERVER_PORT:-8765}:8765"
    restart: unless-stopped

  client:
    image: ${IMAGE_NAMESPACE:-thenemesis47}/visioncaption-client:${IMAGE_TAG:-latest}
    build:
      context: ${CLIENT_CONTEXT:-../TESI-Vision_Caption_Client}
    environment:
      VISION_SERVER: server:8765
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

  # ---------------------------------------------------------------- locale
  ollama:
    profiles: ["local-vlm"]
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    # Il server impiega qualche secondo ad aprire la porta: chi dipende da
    # Ollama aspetta che risponda, non solo che il contenitore sia partito.
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Il primo avvio non ha ancora il modello: questo servizio lo scarica e si
  # spegne. `docker compose --profile local-vlm run --rm ollama-pull`
  ollama-pull:
    profiles: ["local-vlm"]
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull ${VLM_MODEL:-gemma3:4b}"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  chatterbox:
    profiles: ["local-tts"]
    # Non esiste un'immagine pubblicata: si costruisce dal progetto originale,
    # clonato accanto a questo. https://github.com/travisvn/chatterbox-tts-api
    build:
      context: ${CHATTERBOX_CONTEXT:-../chatterbox-tts-api}
      dockerfile: docker/Dockerfile.gpu
    volumes:
      - chatterbox-models:/app/models
    ports:
      - "${CHATTERBOX_PORT:-4123}:4123"
    restart: unless-stopped

  # Fish Speech con OpenAudio S1-mini: 0,5 miliardi di parametri, italiano
  # compreso, pesi con licenza non commerciale (CC-BY-NC-SA 4.0). I modelli
  # Fish più grandi chiedono 24 GB di GPU o più. L'immagine si costruisce dal
  # commit di settembre 2025, l'ultimo il cui server parte con S1-mini.
  fish:
    profiles: ["local-tts-fish"]
    build:
      context: https://github.com/fishaudio/fish-speech.git#cccad3e098d97bf1cdcaefc6d149de091d4893da
      dockerfile: docker/Dockerfile
      target: server
      args:
        BACKEND: cuda
    volumes:
      - fish-checkpoints:/app/checkpoints
    ports:
      - "${FISH_PORT:-8081}:8080"
    restart: unless-stopped

  # Il modello è ad accesso controllato: si accettano le condizioni su
  # https://huggingface.co/fishaudio/openaudio-s1-mini e si mette un token di
  # lettura in HF_TOKEN nel .env. Poi, una volta sola:
  #   docker compose --profile local-tts-fish run --rm fish-download
  fish-download:
    profiles: ["local-tts-fish"]
    image: python:3.12-slim
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        pip install --quiet --root-user-action=ignore "huggingface_hub[cli]" &&
        hf download fishaudio/openaudio-s1-mini
        --local-dir /checkpoints/openaudio-s1-mini
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    volumes:
      - fish-checkpoints:/checkpoints
    restart: "no"

volumes:
  server-logs:
  fish-checkpoints:
  ollama-models:
  chatterbox-models:
